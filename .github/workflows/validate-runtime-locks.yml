name: Validate runtime source locks

on:
  push:
    paths:
      - "runtime/**"
      - "scripts/validate-source-locks.py"
      - ".github/workflows/validate-runtime-locks.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "scripts/validate-source-locks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned sources
        run: python scripts/validate-source-locks.py
