name: Build private ARM64 runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "scripts/prepare-private-runtime-source.py"
      - "scripts/validate-private-runtime-bootstrap.py"
      - "app/**"
      - ".github/workflows/build-private-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "scripts/prepare-private-runtime-source.py"
      - "scripts/validate-private-runtime-bootstrap.py"
      - "app/**"
      - ".github/workflows/build-private-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep expensive ARM64 bootstrap builds serialized; a newer commit supersedes an older build.
concurrency:
  group: private-runtime-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-bootstrap:
    # Pin the host image so Docker and disk layout do not change under ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Checkout pinned Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 1d8cc3f98c8a685f3a1475becbb0fe7d7dcda7fd
          path: vendor/termux-packages

      - name: Configure custom application prefix
        run: |
          python3 -m py_compile scripts/prepare-private-runtime-source.py
          python3 scripts/prepare-private-runtime-source.py vendor/termux-packages
          bash -n vendor/termux-packages/scripts/run-docker.sh
          bash -n vendor/termux-packages/scripts/build-bootstraps.sh

      - name: Free runner disk space and capture diagnostics
        run: |
          echo "===== Disk before cleanup ====="
          df -h
          echo "===== Memory before cleanup ====="
          free -h
          echo "===== Docker version ====="
          docker version
          # The builder image installs a complete Android/LLVM toolchain. Remove
          # unused SDKs and language toolchains preinstalled on the ephemeral host.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/swift /usr/local/lib/android/sdk
          docker system prune --all --force --volumes || true
          echo "===== Disk after cleanup ====="
          df -h

      # run-docker.sh mounts this host directory into /home/builder/.termux-build.
      # Reusing it preserves downloaded sources, Rust/Cargo data and completed package builds.
      - name: Restore Termux ARM64 build cache
        uses: actions/cache@v4
        with:
          path: ~/.termux-build
          key: termux-private-runtime-ubuntu24-aarch64-${{ hashFiles('runtime/sources.lock.yml', 'runtime/private-runtime-config.json', 'scripts/prepare-private-runtime-source.py') }}
          restore-keys: |
            termux-private-runtime-ubuntu24-aarch64-

      - name: Prepare writable Termux build and prefix directories
        run: |
          mkdir -p "$HOME/.termux-build" "$HOME/.termux-build/prefix"
          # The container's writable overlay is much smaller than the runner disk.
          # Keep installed Termux packages on the persistent host-mounted build volume.
          chmod 0777 "$HOME/.termux-build" "$HOME/.termux-build/prefix"
          echo "===== Host disk after cache restore ====="
          df -h "$HOME"
          du -sh "$HOME/.termux-build" "$HOME/.termux-build/prefix" || true

      - name: Pull pinned Ubuntu builder base image
        run: docker pull ubuntu:26.04

      - name: Build package-builder image from pinned source
        working-directory: vendor/termux-packages/scripts
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --pull --progress=plain --file Dockerfile --tag codex-runtime-builder:${{ github.sha }} .

      - name: Build ARM64 bootstrap from source
        working-directory: vendor/termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: codex-runtime-builder:${{ github.sha }}
          CONTAINER_NAME: codex-runtime-builder-${{ github.run_id }}
        run: |
          # Mount only dedicated writable directories. Never bind-mount the runner's
          # /data: Termux creates /data/TERMUX_ARCH inside the container. The package
          # prefix is mounted separately to keep large installed binaries/libraries
          # out of Docker's limited writable overlay and persist them in Actions cache.
          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume $HOME/.termux-build:/home/builder/.termux-build --volume $HOME/.termux-build/prefix:/data/data/com.codex.zhou/files/runtime/prefix"
          # The 7.7 GiB hosted runner killed rustc while compiling codex-tui.
          # Build one package at a time and disable Thin LTO to lower peak RAM.
          ./scripts/run-docker.sh bash -c 'cd /home/builder/termux-packages && export TERMUX_PKG_MAKE_PROCESSES=1 CARGO_PROFILE_RELEASE_LTO=false && echo "===== Container disk before build =====" && df -h / /data /data/data/com.codex.zhou/files/runtime/prefix && ./scripts/build-bootstraps.sh --android10 --architectures aarch64'

      - name: Validate bootstrap and write provenance
        run: |
          python3 -m py_compile scripts/validate-private-runtime-bootstrap.py
          mkdir -p runtime/dist
          cp vendor/termux-packages/output/bootstrap-aarch64.zip runtime/dist/
          python3 scripts/validate-private-runtime-bootstrap.py \
            runtime/dist/bootstrap-aarch64.zip \
            --manifest runtime/dist/bootstrap-manifest.json

      - name: Upload ARM64 runtime bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: codex-zh-private-runtime-arm64
          path: runtime/dist/*
          if-no-files-found: error
          retention-days: 14

  assemble-debug-with-runtime:
    needs: build-arm64-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Download validated ARM64 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: codex-zh-private-runtime-arm64
          path: runtime/dist

      - name: Embed bootstrap into APK assets
        run: |
          mkdir -p app/src/main/assets/runtime
          cp runtime/dist/bootstrap-aarch64.zip app/src/main/assets/runtime/
          cp runtime/dist/bootstrap-manifest.json app/src/main/assets/runtime/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK with private runtime
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK with private runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-zh-android-debug-with-runtime
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
