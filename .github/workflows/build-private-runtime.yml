name: Build private ARM64 runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "scripts/prepare-private-runtime-source.py"
      - "scripts/validate-private-runtime-bootstrap.py"
      - ".github/workflows/build-private-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Checkout pinned Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 1d8cc3f98c8a685f3a1475becbb0fe7d7dcda7fd
          path: vendor/termux-packages

      - name: Configure custom application prefix
        run: |
          python3 -m py_compile scripts/prepare-private-runtime-source.py
          python3 scripts/prepare-private-runtime-source.py vendor/termux-packages
          bash -n vendor/termux-packages/scripts/run-docker.sh
          bash -n vendor/termux-packages/scripts/build-bootstraps.sh

      - name: Build package-builder image from pinned source
        working-directory: vendor/termux-packages/scripts
        run: docker build --file Dockerfile --tag codex-runtime-builder:${{ github.sha }} .

      - name: Build ARM64 bootstrap from source
        working-directory: vendor/termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: codex-runtime-builder:${{ github.sha }}
          CONTAINER_NAME: codex-runtime-builder-${{ github.run_id }}
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --android10 --architectures aarch64

      - name: Validate bootstrap and write provenance
        run: |
          python3 -m py_compile scripts/validate-private-runtime-bootstrap.py
          mkdir -p runtime/dist
          cp vendor/termux-packages/bootstrap-aarch64.zip runtime/dist/
          python3 scripts/validate-private-runtime-bootstrap.py \
            runtime/dist/bootstrap-aarch64.zip \
            --manifest runtime/dist/bootstrap-manifest.json

      - name: Upload ARM64 runtime bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: codex-zh-private-runtime-arm64
          path: runtime/dist/*
          if-no-files-found: error
          retention-days: 14
